<div class="balance-card">
  <h2> Your Balance</h2>
  <div class="balance-amount">
    {{ balance$ | async }} <span class="currency">coins</span>
  </div>
  <div class="address-section">
    <label>Your Address:</label>
    <div class="address-box">
      {{ address$ | async }}
    </div>
  </div>
</div>
