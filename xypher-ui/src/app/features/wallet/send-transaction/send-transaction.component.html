<div class="send-transaction-container">
  <h2>Send Transaction</h2>
  
  <form [formGroup]="sendForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="recipientAddress">Recipient Address</label>
      <input 
        type="text" 
        id="recipientAddress" 
        formControlName="recipientAddress"
        placeholder="Enter 130-character address"
        class="form-control"
      >
      <div class="error" *ngIf="sendForm.get('recipientAddress')?.invalid && sendForm.get('recipientAddress')?.touched">
        Please enter a valid address (130 characters)
      </div>
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input 
        type="number" 
        id="amount" 
        formControlName="amount"
        placeholder="0.00"
        step="0.01"
        class="form-control"
      >
      <div class="error" *ngIf="sendForm.get('amount')?.invalid && sendForm.get('amount')?.touched">
        Please enter a valid amount
      </div>
    </div>

    <div class="form-group checkbox">
      <label>
        <input type="checkbox" formControlName="mineImmediately">
        Mine immediately (otherwise adds to transaction pool)
      </label>
    </div>

    <div class="alert alert-success" *ngIf="success">
      {{ success }}
    </div>

    <div class="alert alert-error" *ngIf="error">
      {{ error }}
    </div>

    <button 
      type="submit" 
      [disabled]="sendForm.invalid || loading"
      class="btn btn-primary"
    >
      <span *ngIf="!loading">Send Transaction</span>
      <span *ngIf="loading">Processing...</span>
    </button>
  </form>
</div>
