<div class="container">
  <div class="block-explorer-search">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      class="search-input"
      placeholder="Search by block hash or block number..."
    >
  </div>

  <div *ngFor="let block of filteredBlocks$ | async" class="block-item">
    <div class="block-header">
      <span class="block-index">#{{ block.index }}</span>
      <span class="block-time">{{ block.timestamp * 1000 | date:'medium' }}</span>
    </div>
    <div class="block-hash">
      <label>Hash:</label>
      <span>{{ block.hash }}</span>
    </div>
    <div class="block-hash">
      <label>Prev:</label>
      <span>{{ block.previousHash || 'Genesis' }}</span>
    </div>
    <div class="block-txs">
      <span class="badge">{{ block.data.length }} tx</span>
      <span class="badge">Difficulty: {{ block.difficulty }}</span>
      <span class="badge">Nonce: {{ block.nonce }}</span>
    </div>
  </div>

  <div *ngIf="(filteredBlocks$ | async)?.length === 0" class="empty-state">
    <div class="empty-state-icon">⬡</div>
    <p>No blocks found</p>
  </div>
</div>
