<div class="section">
  <h2>Send Transaction</h2>

  <div class="form-group">
    <label>Recipient Address</label>
    <input
      type="text"
      [formControl]="recipientAddress"
      placeholder="Enter 130-character hex address"
      class="form-control"
      [class.error]="recipientAddress.invalid && recipientAddress.touched"
    >
    <div class="error-text" *ngIf="recipientAddress.invalid && recipientAddress.touched">
      Address must be exactly 130 hex characters
    </div>
  </div>

  <div class="form-group">
    <label>Amount (XYP)</label>
    <input
      type="number"
      [formControl]="amount"
      placeholder="0"
      min="1"
      class="form-control"
      [class.error]="amount.invalid && amount.touched"
    >
    <div class="error-text" *ngIf="amount.invalid && amount.touched">
      Amount must be at least 1
    </div>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="mineNow" [formControl]="mineImmediately">
    <label for="mineNow">Mine immediately (confirm right away instead of waiting)</label>
  </div>

  <div class="alert alert-success" *ngIf="success">{{ success }}</div>
  <div class="alert alert-error" *ngIf="error">{{ error }}</div>

  <button
    class="btn btn-primary"
    (click)="onSubmit()"
    [disabled]="recipientAddress.invalid || amount.invalid || loading"
  >
    <span *ngIf="!loading">Send XYP</span>
    <span *ngIf="loading"><span class="loading-spinner"></span> Processing...</span>
  </button>
</div>
