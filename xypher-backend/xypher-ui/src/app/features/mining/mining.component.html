<div class="page-container">
  <div class="page-header">
    <h1>mining</h1>
    <p class="page-subtitle">mine new blocks and earn rewards</p>
  </div>

  <div class="card mining-card">
    <div class="mining-icon">⛏</div>
    <h3>mine new block</h3>
    <p>mine a new block and earn 50 coins + transaction fees</p>

    <div *ngIf="miningResult" class="alert alert-success">{{ miningResult }}</div>

    <button class="btn-primary" (click)="startMining()" [disabled]="mining">
      <span *ngIf="!mining">start mining</span>
      <span *ngIf="mining">mining in progress...</span>
    </button>
  </div>

  <div class="card pool-card">
    <h3>transaction pool</h3>

    <div class="pool-list">
      <div *ngFor="let tx of transactionPool$ | async" class="pool-item">
        <div class="tx-id">{{ tx.id.substring(0, 20) }}...</div>
        <div class="tx-meta">
          <span>{{ tx.txIns.length }} input(s)</span>
          <span>{{ tx.txOuts.length }} output(s)</span>
        </div>
      </div>

      <div *ngIf="(transactionPool$ | async)?.length === 0" class="empty-state">
        no pending transactions
      </div>
    </div>
  </div>
</div>
