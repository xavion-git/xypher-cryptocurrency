<div class="page-container">
  <div class="page-header">
    <h1>network</h1>
    <p class="page-subtitle">manage peer connections</p>
  </div>

  <div class="stat-row">
    <div class="card mini-stat">
      <label>active peers</label>
      <div class="mini-stat-value">{{ peers.length }}</div>
    </div>
    <div class="card mini-stat">
      <label>network status</label>
      <div class="mini-stat-value" [class.online]="peers.length > 0">
        {{ peers.length > 0 ? 'online' : 'offline' }}
      </div>
    </div>
  </div>

  <div class="card peers-card">
    <h3>connected peers</h3>

    <div *ngIf="loading" class="empty-state">loading peers...</div>

    <div class="peer-list" *ngIf="!loading">
      <div *ngFor="let peer of peers" class="peer-item">
        <div class="peer-left">
          <span class="status-dot"></span>
          <span class="peer-address">{{ peer }}</span>
        </div>
        <span class="peer-status">connected</span>
      </div>

      <div *ngIf="peers.length === 0" class="empty-state">no peers connected</div>
    </div>

    <div class="add-peer-row">
      <input
        type="text"
        [(ngModel)]="newPeerAddress"
        class="form-control"
        placeholder="ws://peer-address:port"
      >
      <button class="btn-primary" (click)="addPeer()">add peer</button>
    </div>
  </div>
</div>
