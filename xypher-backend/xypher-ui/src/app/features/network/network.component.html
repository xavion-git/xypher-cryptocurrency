<div class="network-page">

  <div class="page-header">
    <div>
      <h1 class="page-title">Network</h1>
      <p class="page-sub">Manage peers and monitor connectivity</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="glass stat-card">
      <div class="stat-label">
        <span class="material-symbols-outlined">people</span>
        Active Peers
      </div>
      <div class="stat-value">{{ peers.length }}</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-label">
        <span class="material-symbols-outlined">wifi</span>
        Network Status
      </div>
      <div class="stat-value" [class.online]="peers.length > 0">
        {{ peers.length > 0 ? 'Online' : 'Isolated' }}
      </div>
    </div>
  </div>

  <!-- Peers list -->
  <div class="glass peers-card">
    <div class="section-header">
      <span class="material-symbols-outlined">hub</span>
      Connected Peers
    </div>

    <div *ngIf="loading" class="loading-text">
      <span class="material-symbols-outlined spinning">progress_activity</span>
      Loading peers...
    </div>

    <div *ngIf="!loading">
      <div *ngFor="let peer of peers" class="peer-row">
        <div class="peer-left">
          <span class="peer-dot"></span>
          <span class="peer-address">{{ peer }}</span>
        </div>
        <span class="peer-status">Connected</span>
      </div>

      <div *ngIf="peers.length === 0" class="empty-state">
        <span class="material-symbols-outlined empty-icon">hub</span>
        <p>No peers connected</p>
      </div>
    </div>

    <!-- Add peer -->
    <div class="add-peer">
      <input
        type="text"
        [(ngModel)]="newPeerAddress"
        class="peer-input"
        placeholder="ws://peer-address:6001"
      >
      <button class="add-btn" (click)="addPeer()">
        <span class="material-symbols-outlined">add</span>
        Add Peer
      </button>
    </div>
  </div>

</div>
