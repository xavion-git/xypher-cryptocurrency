<div class="card send-card">
  <h3>send transaction</h3>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="recipientAddress">recipient address</label>
      <input
        type="text"
        id="recipientAddress"
        [formControl]="recipientAddress"
        placeholder="enter 130-character address"
        class="form-control"
      >
      <div class="error" *ngIf="recipientAddress.invalid && recipientAddress.touched">
        please enter a valid address (130 hex characters)
      </div>
    </div>

    <div class="form-group">
      <label for="amount">amount</label>
      <input
        type="number"
        id="amount"
        [formControl]="amount"
        placeholder="0.00"
        step="0.01"
        class="form-control"
      >
      <div class="error" *ngIf="amount.invalid && amount.touched">
        please enter a valid amount (minimum 1)
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="mineImmediately" [formControl]="mineImmediately">
      <label for="mineImmediately">mine immediately</label>
    </div>

    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <button type="submit" [disabled]="recipientAddress.invalid || amount.invalid || loading" class="btn-primary">
      <span *ngIf="!loading">send transaction</span>
      <span *ngIf="loading">processing...</span>
    </button>
  </form>
</div>
