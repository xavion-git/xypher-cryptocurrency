<div class="card send-card">
  <h3>send transaction</h3>

  <form [formGroup]="sendForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="recipientAddress">recipient address</label>
      <input
        type="text"
        id="recipientAddress"
        formControlName="recipientAddress"
        placeholder="enter 130-character address"
        class="form-control"
      >
      <div class="error" *ngIf="sendForm.get('recipientAddress')?.invalid && sendForm.get('recipientAddress')?.touched">
        please enter a valid address (130 characters)
      </div>
    </div>

    <div class="form-group">
      <label for="amount">amount</label>
      <input
        type="number"
        id="amount"
        formControlName="amount"
        placeholder="0.00"
        step="0.01"
        class="form-control"
      >
      <div class="error" *ngIf="sendForm.get('amount')?.invalid && sendForm.get('amount')?.touched">
        please enter a valid amount (minimum 0.01)
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="mineImmediately" formControlName="mineImmediately">
      <label for="mineImmediately">mine immediately</label>
    </div>

    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <button type="submit" [disabled]="sendForm.invalid || loading" class="btn-primary">
      <span *ngIf="!loading">send transaction</span>
      <span *ngIf="loading">processing...</span>
    </button>
  </form>
</div>
