<div class="glass wallet-card">
  <div class="wallet-left">
    <div class="wallet-label">Balance</div>
    <div class="wallet-balance">
      {{ (balance$ | async) ?? 0 }}
      <span class="wallet-currency">XYP</span>
    </div>
    <div class="wallet-addr-label">Address</div>
    <div class="wallet-addr">{{ (address$ | async) || 'Loading...' }}</div>
  </div>
  <div class="wallet-right">
    <span class="material-symbols-outlined wallet-icon">account_balance_wallet</span>
  </div>
</div>
