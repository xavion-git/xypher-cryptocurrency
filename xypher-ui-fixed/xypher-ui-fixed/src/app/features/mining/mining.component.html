<div class="mining-container">
  <div class="header">
    <h1>Mining</h1>
  </div>

  <div class="mining-section">
    <div class="mining-icon">⛏️</div>
    <h3>Mine New Block</h3>
    <p>Mine a new block and earn 50 coins + transaction fees</p>
    
    <div *ngIf="miningResult" class="mining-result">
      {{ miningResult }}
    </div>
    
    <button 
      class="btn btn-success" 
      (click)="startMining()"
      [disabled]="mining"
    >
      <span *ngIf="!mining"> Start Mining</span>
      <span *ngIf="mining"> Mining in Progress...</span>
    </button>
  </div>

  <div class="section">
    <h2>⏳ Transaction Pool</h2>
    <div class="transaction-pool">
      <div *ngFor="let tx of transactionPool$ | async" class="transaction-item">
        <div class="tx-id">TX: {{ tx.id.substring(0, 16) }}...</div>
        <div class="tx-details">
          <span>{{ tx.txIns.length }} input(s)</span>
          <span>{{ tx.txOuts.length }} output(s)</span>
        </div>
      </div>
      
      <div *ngIf="(transactionPool$ | async)?.length === 0" class="empty-state">
        No pending transactions
      </div>
    </div>
  </div>
</div>
