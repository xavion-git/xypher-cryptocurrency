<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">

  <!-- Card Background -->
  <rect width="720" height="420" rx="28" fill="#0D0D0D"/>

  <!-- Inner Matte Surface -->
  <rect x="20" y="20" width="680" height="380" rx="24" fill="#141414"/>

  <!-- Brushed Silver Gradient -->
  <defs>
    <linearGradient id="titaniumSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9EA3A8"/>
      <stop offset="50%" stop-color="#E5E8EB"/>
      <stop offset="100%" stop-color="#8A8F94"/>
    </linearGradient>
  </defs>

  <!-- Emblem Outer Ring -->
  <circle cx="360" cy="170" r="85"
          stroke="url(#titaniumSilver)"
          stroke-width="2"
          fill="none"/>

  <!-- Emblem Inner Ring -->
  <circle cx="360" cy="170" r="65"
          stroke="url(#titaniumSilver)"
          stroke-width="1.5"
          fill="none"/>

  <!-- Minimal Engraved X -->
  <path d="M335 140 L385 200 M385 140 L335 200"
        stroke="url(#titaniumSilver)"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Brand Name -->
  <text x="360" y="310"
        text-anchor="middle"
        fill="#E5E8EB"
        font-family="Helvetica, Arial, sans-serif"
        font-size="34"
        letter-spacing="12"
        font-weight="500">
        XYPHER
  </text>

  <!-- Subtext -->
  <text x="360" y="345"
        text-anchor="middle"
        fill="#8A8F94"
        font-family="Helvetica, Arial, sans-serif"
        font-size="15"
        letter-spacing="10">
        COIN
  </text>

</svg>
