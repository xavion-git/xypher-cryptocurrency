name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./xypher-backend
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/xypher-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/xypher-backend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/xypher-backend:latest
        cache-to: type=inline
    
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./xypher-backend/xypher-ui
        file: ./xypher-backend/xypher-ui/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/xypher-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/xypher-frontend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/xypher-frontend:latest
        cache-to: type=inline

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-docker
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Deploy backend to Fly.io
      run: flyctl deploy --remote-only --config fly.backend.toml
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-docker
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Deploy frontend to Fly.io
      run: flyctl deploy --remote-only --config fly.frontend.toml
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}