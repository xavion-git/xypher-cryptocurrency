name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'xypher-backend/xypher-ui/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'xypher-backend/xypher-ui/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: xypher-backend/xypher-ui/package-lock.json
    
    - name: Install dependencies
      working-directory: ./xypher-backend/xypher-ui
      run: npm ci
    
    - name: Lint code
      working-directory: ./xypher-backend/xypher-ui
      run: npm run lint || echo "No lint script found"
    
    - name: Run tests
      working-directory: ./xypher-backend/xypher-ui
      run: npm test -- --watch=false --browsers=ChromeHeadless || echo "No tests found"
    
    - name: Build for production
      working-directory: ./xypher-backend/xypher-ui
      run: npm run build
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: xypher-backend/xypher-ui/dist/
        retention-days: 7
    
    - name: Run bundle size analysis
      working-directory: ./xypher-backend/xypher-ui
      run: du -sh dist/* || echo "Build size check"

  lighthouse-audit:
    runs-on: ubuntu-latest
    needs: test-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: xypher-backend/xypher-ui/package-lock.json

    - name: Install dependencies
      working-directory: ./xypher-backend/xypher-ui
      run: npm ci
    
    - name: Build
      working-directory: ./xypher-backend/xypher-ui
      run: npm run build
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"

    - name: Serve built app
      working-directory: ./xypher-backend/xypher-ui
      run: npx serve -s dist -l 4200 &

    - name: Wait for server to be ready
      run: npx wait-on http://localhost:4200 --timeout 30000

    - name: Lighthouse CI
      uses: treosh/lighthouse-ci-action@v11
      with:
        urls: |
          http://localhost:4200
        uploadArtifacts: true